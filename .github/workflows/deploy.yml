name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  # The Cloudflare Worker this repo deploys to. Your custom domain is bound to
  # this name, so changing it creates a NEW worker and drshreyas.com stops working.
  WORKER_NAME: drshreyasorthopedic

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        # VITE_* values are inlined into the client bundle at build time, so they
        # must be present here rather than as Worker runtime secrets.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PATIENT_MANAGE_ENABLED: ${{ vars.VITE_PATIENT_MANAGE_ENABLED || 'false' }}
        run: pnpm run build

      # Worker secrets persist across deployments, so they only need uploading
      # when a value is actually configured. Uploading an unset GitHub secret
      # would overwrite a working Worker secret with an empty string, so every
      # value is filtered out unless it is non-empty.
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
        run: |
          count=$(node -e '
            const names = [
              "SUPABASE_URL",
              "SUPABASE_PUBLISHABLE_KEY",
              "SUPABASE_SERVICE_ROLE_KEY",
              "TWILIO_ACCOUNT_SID",
              "TWILIO_AUTH_TOKEN",
              "TWILIO_VERIFY_SERVICE_SID",
            ];
            const out = {};
            for (const n of names) if (process.env[n]) out[n] = process.env[n];
            require("fs").writeFileSync("worker-secrets.json", JSON.stringify(out));
            console.error("Configured secrets: " + (Object.keys(out).join(", ") || "(none)"));
            process.stdout.write(String(Object.keys(out).length));
          ')
          if [ "$count" != "0" ]; then
            npx --yes wrangler@4 secret bulk worker-secrets.json --name "$WORKER_NAME"
          else
            echo "No Worker secrets configured; leaving existing values untouched."
          fi
          rm -f worker-secrets.json

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Nitro writes .wrangler/deploy/config.json pointing at the generated
          # .output/server/wrangler.json, which wrangler picks up automatically.
          command: deploy --name ${{ env.WORKER_NAME }}
